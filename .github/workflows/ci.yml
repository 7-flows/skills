# The free gates on every push. Evals cost model calls, so they run at
# release, on a maintainer's machine — `sevenflows release` reads their result.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit: a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Skills
        run: uv run sevenflows build --check && uv run sevenflows lint
      - name: Spec
        run: for s in skills/*/; do uv run agentskills validate "$s" || exit 1; done
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.296
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plugin
        run: claude plugin validate . --strict
